<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BANBAN TETRIS - Doggy Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
  <!-- Background Glow & Cyber Grid -->
  <div class="cyber-grid"></div>
  <div class="glow-sphere sphere-1"></div>
  <div class="glow-sphere sphere-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="game-header">
      <div class="header-left">
        <div class="logo-wrap">
          <img src="assets/banban/char_idle.jpg" alt="반반이 로고" class="header-mini-avatar">
          <h1 class="logo-title">BANBAN<span class="highlight">TETRIS</span></h1>
        </div>
      </div>
      <div class="header-controls">
        <button id="btn-gallery" class="btn-pill" title="반반이 실사 앨범">
          <img src="assets/banban/banban2.jpg" alt="앨범" class="btn-thumb"> <span>반반이 사진첩</span>
        </button>
        <button id="btn-sound" class="btn-icon" title="사운드 토글 (M)">
          <span class="icon">🔊</span>
        </button>
        <button id="btn-pause" class="btn-icon" title="일시정지 (P)">
          <span class="icon">⏸️</span>
        </button>
        <button id="btn-restart" class="btn-icon" title="다시 시작 (R)">
          <span class="icon">🔄</span>
        </button>
      </div>
    </header>

    <!-- Main Game Layout -->
    <main class="game-layout">
      <!-- Left Panel: Banban Mascot & Hold -->
      <aside class="side-panel left-panel">
        <!-- Banban Mascot Interactive Widget -->
        <div class="glass-card mascot-card">
          <div class="mascot-avatar-wrap">
            <div class="avatar-glow"></div>
            <img src="assets/banban/char_idle.jpg" alt="반반이 캐릭터" id="banbanAvatar" class="banban-img">
            <span class="mascot-badge" id="mascotBadge">집중 모드</span>
          </div>
          <div class="mascot-info">
            <span class="mascot-name">우리집 귀요미 반반이</span>
            <div class="speech-bubble" id="banbanSpeech">
              블록 떨어지는 중... 집중!
            </div>
          </div>
          <!-- Fever Meter -->
          <div class="fever-meter-wrap">
            <div class="fever-label">
              <span>BANBAN FEVER</span>
              <span id="feverPercent" class="neon-gold">0%</span>
            </div>
            <div class="fever-track">
              <div class="fever-bar" id="feverBar"></div>
            </div>
          </div>
        </div>

        <!-- Hold Box -->
        <div class="glass-card panel-box">
          <div class="box-label">HOLD <span class="key-hint">[C / Shift]</span></div>
          <div class="canvas-container mini-container">
            <canvas id="holdCanvas" width="120" height="120"></canvas>
          </div>
        </div>
      </aside>

      <!-- Center: Main Game Board -->
      <section class="board-wrapper">
        <div class="board-glass-frame" id="boardFrame">
          <canvas id="gameCanvas" width="300" height="600"></canvas>
          
          <!-- In-game Combo & Impact Banner -->
          <div id="comboBanner" class="combo-banner">
            <div class="combo-text" id="comboText">COMBO x2!</div>
            <div class="combo-sub" id="comboSub">반반이 파워 발동!</div>
          </div>

          <!-- Danger Warning Vignette -->
          <div id="dangerVignette" class="danger-vignette"></div>
        </div>
      </section>

      <!-- Right Panel: Score, Stats & Next Queue -->
      <aside class="side-panel right-panel">
        <!-- Score & Stats -->
        <div class="glass-card panel-box stats-box">
          <div class="stat-item">
            <span class="stat-title">SCORE</span>
            <span id="scoreDisplay" class="stat-value neon-blue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">COMBO</span>
            <span id="comboDisplay" class="stat-value neon-magenta">0 COMBO</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">LEVEL</span>
            <span id="levelDisplay" class="stat-value neon-purple">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">LINES</span>
            <span id="linesDisplay" class="stat-value neon-cyan">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">HIGH SCORE</span>
            <span id="highScoreDisplay" class="stat-value neon-gold">0</span>
          </div>
        </div>

        <!-- Next Queue -->
        <div class="glass-card panel-box">
          <div class="box-label">NEXT</div>
          <div class="canvas-container next-container">
            <canvas id="nextCanvas" width="120" height="300"></canvas>
          </div>
        </div>
      </aside>
    </main>

    <!-- Mobile Virtual Touch Controls -->
    <div class="touch-controls" id="touchControls">
      <div class="dpad-left">
        <button class="touch-btn" id="tBtnLeft">◀</button>
        <button class="touch-btn" id="tBtnRight">▶</button>
        <button class="touch-btn" id="tBtnDown">▼</button>
      </div>
      <div class="dpad-actions">
        <button class="touch-btn action-hold" id="tBtnHold">HOLD</button>
        <button class="touch-btn action-rotate" id="tBtnRotL">↺</button>
        <button class="touch-btn action-rotate" id="tBtnRotR">↻</button>
        <button class="touch-btn action-harddrop" id="tBtnHard">DROP</button>
      </div>
    </div>
  </div>

  <!-- Banban Photo Gallery Modal -->
  <div id="galleryModal" class="modal-backdrop hidden">
    <div class="modal-content glass-card gallery-modal-content">
      <div class="modal-header-row">
        <h2 class="modal-title neon-gold">우리집 반반이 실사 앨범</h2>
        <button id="btnCloseGallery" class="btn-icon">✖</button>
      </div>
      <p class="modal-desc">테트리스 최고의 응원단장, 폼피츠 반반이의 힐링 사진첩</p>
      
      <div class="gallery-grid">
        <div class="polaroid-card">
          <img src="assets/banban/banban2.jpg" alt="바닷가 산책 반반이">
          <span>바닷가 산책 윙크</span>
        </div>
        <div class="polaroid-card">
          <img src="assets/banban/banban1.jpg" alt="침대에서 낮잠 반반이">
          <span>침대에서 힐링 낮잠</span>
        </div>
        <div class="polaroid-card">
          <img src="assets/banban/banban3.jpg" alt="호기심 가득 반반이">
          <span>똘망똘망 호기심</span>
        </div>
        <div class="polaroid-card">
          <img src="assets/banban/banban4.jpg" alt="간식 기다리는 반반이">
          <span>간식 기다리는 중</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Overlays (Game Over / Pause) -->
  <div id="overlayModal" class="modal-backdrop hidden">
    <div class="modal-content glass-card">
      <img src="assets/banban/char_panic.jpg" alt="반반이 상태" class="modal-banban-photo" id="modalBanbanPhoto">
      <h2 id="modalTitle" class="modal-title">GAME OVER</h2>
      <p id="modalSubtitle" class="modal-subtitle">최종 점수: <span id="finalScore" class="neon-cyan">0</span></p>
      <div class="modal-actions">
        <button id="modalActionBtn" class="glow-btn">반반이랑 다시하기</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js?v=3.0"></script>
  <script src="js/particles.js?v=3.0"></script>
  <script src="js/tetris.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>
</body>
</html>
