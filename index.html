<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON TETRIS - Cyberpunk Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Glow & Cyber Grid -->
  <div class="cyber-grid"></div>
  <div class="glow-sphere sphere-1"></div>
  <div class="glow-sphere sphere-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="game-header">
      <h1 class="logo-title">NEON<span class="highlight">TETRIS</span></h1>
      <div class="header-controls">
        <button id="btn-sound" class="btn-icon" title="사운드 토글 (M)">
          <span class="icon">🔊</span>
        </button>
        <button id="btn-pause" class="btn-icon" title="일시정지 (P)">
          <span class="icon">⏸️</span>
        </button>
        <button id="btn-restart" class="btn-icon" title="다시 시작 (R)">
          <span class="icon">🔄</span>
        </button>
      </div>
    </header>

    <!-- Main Game Wrapper -->
    <main class="game-layout">
      <!-- Left Panel: Hold & Stats -->
      <aside class="side-panel left-panel">
        <!-- Hold Box -->
        <div class="glass-card panel-box">
          <div class="box-label">HOLD <span class="key-hint">[C / Shift]</span></div>
          <div class="canvas-container mini-container">
            <canvas id="holdCanvas" width="120" height="120"></canvas>
          </div>
        </div>

        <!-- Score & Stats -->
        <div class="glass-card panel-box stats-box">
          <div class="stat-item">
            <span class="stat-title">SCORE</span>
            <span id="scoreDisplay" class="stat-value neon-blue">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">LEVEL</span>
            <span id="levelDisplay" class="stat-value neon-purple">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">LINES</span>
            <span id="linesDisplay" class="stat-value neon-cyan">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">HIGH SCORE</span>
            <span id="highScoreDisplay" class="stat-value neon-gold">0</span>
          </div>
        </div>
      </aside>

      <!-- Center: Main Game Board -->
      <section class="board-wrapper">
        <div class="board-glass-frame" id="boardFrame">
          <canvas id="gameCanvas" width="300" height="600"></canvas>
          
          <!-- In-game Notification Banner -->
          <div id="comboBanner" class="combo-banner">TETRIS!</div>
        </div>
      </section>

      <!-- Right Panel: Next Queue & Key Guide -->
      <aside class="side-panel right-panel">
        <!-- Next Queue -->
        <div class="glass-card panel-box">
          <div class="box-label">NEXT</div>
          <div class="canvas-container next-container">
            <canvas id="nextCanvas" width="120" height="300"></canvas>
          </div>
        </div>

        <!-- Key Controls Guide -->
        <div class="glass-card panel-box guide-box">
          <div class="box-label">CONTROLS</div>
          <ul class="control-list">
            <li><span class="badge">← →</span> 이동</li>
            <li><span class="badge">↓</span> 소프트 드롭</li>
            <li><span class="badge">Space</span> 하드 드롭</li>
            <li><span class="badge">↑ / X</span> 시계방향 회전</li>
            <li><span class="badge">Z</span> 반시계 회전</li>
            <li><span class="badge">C / Shift</span> 홀드</li>
          </ul>
        </div>
      </aside>
    </main>

    <!-- Mobile Virtual Touch Controls -->
    <div class="touch-controls" id="touchControls">
      <div class="dpad-left">
        <button class="touch-btn" id="tBtnLeft">◀</button>
        <button class="touch-btn" id="tBtnRight">▶</button>
        <button class="touch-btn" id="tBtnDown">▼</button>
      </div>
      <div class="dpad-actions">
        <button class="touch-btn action-hold" id="tBtnHold">HOLD</button>
        <button class="touch-btn action-rotate" id="tBtnRotL">↺</button>
        <button class="touch-btn action-rotate" id="tBtnRotR">↻</button>
        <button class="touch-btn action-harddrop" id="tBtnHard">DROP</button>
      </div>
    </div>
  </div>

  <!-- Modal Overlays -->
  <div id="overlayModal" class="modal-backdrop hidden">
    <div class="modal-content glass-card">
      <h2 id="modalTitle" class="modal-title">GAME OVER</h2>
      <p id="modalSubtitle" class="modal-subtitle">최종 점수: <span id="finalScore" class="neon-cyan">0</span></p>
      <div class="modal-actions">
        <button id="modalActionBtn" class="glow-btn">다시 도전</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/tetris.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
